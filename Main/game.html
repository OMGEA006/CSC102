<!DOCTYPE html>
<!-- Declares that this document uses HTML5. -->
<html lang="en">
<!-- Opens the HTML document and sets the language to English. -->
<head>
    <!-- Opens the head section for page setup information. -->
    <meta charset="UTF-8">
    <!-- Allows the page to display normal text and special symbols correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page display well on phones, tablets, and computers. -->
    <title>Quarks Casino Craps</title>
    <!-- Sets the text shown on the browser tab. -->

    <style>
        /* Styles the entire page. */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #351c75, #08020f 70%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styles the main casino card. */
        .casino-card {
            width: 90%;
            max-width: 700px;
            padding: 30px;
            border: 3px solid #ffd966;
            border-radius: 22px;
            background-color: rgba(8, 2, 15, 0.94);
            box-shadow: 0 0 30px rgba(255, 217, 102, 0.65);
            text-align: center;
        }

        /* Styles the main heading. */
        h1 {
            margin-top: 0;
            color: #ffd966;
            font-size: 2.4rem;
            letter-spacing: 2px;
        }

        /* Styles the small subtitle text. */
        .subtitle {
            color: #d9d2e9;
            font-size: 1.1rem;
        }

        /* Styles the rules section. */
        .rules {
            margin: 20px auto;
            padding: 15px;
            border-radius: 12px;
            background-color: #20103d;
            text-align: left;
            line-height: 1.6;
        }

        /* Adds spacing around each input row. */
        .form-row {
            margin: 18px 0;
        }

        /* Styles the labels above the inputs. */
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #ffd966;
        }

        /* Styles the input boxes. */
        input {
            width: 85%;
            max-width: 360px;
            padding: 11px;
            border: 2px solid #ffd966;
            border-radius: 9px;
            font-size: 1rem;
            text-align: center;
        }

        /* Styles the roll button. */
        button {
            margin-top: 12px;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background-color: #ffd966;
            color: #12051f;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Adds a hover effect to the button. */
        button:hover {
            background-color: #fff2b2;
            transform: scale(1.03);
        }

        /* Styles validation messages. */
        #validationOutput {
            min-height: 24px;
            color: #ff9999;
            font-weight: bold;
        }

        /* Styles the game result box. */
        #gameOutput {
            margin-top: 20px;
            padding: 20px;
            min-height: 140px;
            border-radius: 14px;
            background-color: #12051f;
            line-height: 1.6;
        }

        /* Makes the dice output large and bright. */
        .dice-line {
            font-size: 2rem;
            color: #ffd966;
            font-weight: bold;
        }

        /* Styles the final outcome. */
        .outcome {
            font-size: 1.3rem;
            font-weight: bold;
        }
    </style>
    <!-- Ends the CSS styling. -->

    <script src="Js/game.js" defer></script>
    <!-- Links this HTML page to the external JavaScript file. -->
</head>
<!-- Ends the head section. -->

<body>
    <!-- Opens the visible page body. -->
    <main class="casino-card">
        <!-- Creates the main game area. -->
        <h1>⚛ Quarks Casino ⚛</h1>
        <!-- Displays the game title. -->

        <p class="subtitle">Roll two dice and test your luck at the quantum craps table!</p>
        <!-- Displays the game subtitle. -->

        <section class="rules">
            <!-- Opens the rules section. -->
            <strong>Rules:</strong>
            <!-- Labels the rules section. -->
            <br>
            <!-- Creates a line break. -->
            Roll 7 or 11 and you lose. Roll even doubles like 2-2, 4-4, or 6-6 and you win.
            <!-- Explains how the craps game works. -->
        </section>
        <!-- Closes the rules section. -->

        <form onsubmit="return false;">
            <!-- Creates a form for all user input without reloading the page. -->
            <div class="form-row">
                <!-- Opens the player name input row. -->
                <label for="playerName">Casino Name</label>
                <!-- Labels the player name input. -->
                <input type="text" id="playerName" placeholder="Enter your name">
                <!-- Lets the user enter a name. -->
            </div>
            <!-- Closes the player name input row. -->

            <div class="form-row">
                <!-- Opens the wager input row. -->
                <label for="chipWager">Quark Chip Wager</label>
                <!-- Labels the wager input. -->
                <input type="number" id="chipWager" placeholder="Enter 1 to 100">
                <!-- Lets the user enter a wager number. -->
            </div>
            <!-- Closes the wager input row. -->

            <button type="submit" onclick="playQuarksCraps()">Roll Quantum Dice</button>
            <!-- Creates a submit button that calls the external JavaScript game function. -->
        </form>
        <!-- Closes the form. -->

        <p id="validationOutput"></p>
        <!-- Gives JavaScript a place to show validation messages with textContent. -->

        <section id="gameOutput">
            <!-- Gives JavaScript a place to show game results with innerHTML. -->
            <p>Enter your name and wager, then roll the dice.</p>
            <!-- Shows the starting message before the game runs. -->
        </section>
        <!-- Closes the game output section. -->
    </main>
    <!-- Closes the main game area. -->
</body>
<!-- Closes the visible page body. -->
</html>
<!-- Closes the HTML document. -->
