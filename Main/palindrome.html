<body>
    <!-- Opens the page body. -->

    <div class="mainBox">
        <!-- Creates the main content box. -->

        <h1>Palindrome Checker</h1>
        <!-- Displays the page title. -->

        <p>Enter a word or phrase to see if it is a palindrome.</p>
        <!-- Gives the user instructions. -->

        <form onsubmit="return false;">
            <!-- Creates the form for the input and button. -->

            <div class="formRow">
                <!-- Groups the label and text box. -->

                <label for="userString">Enter a word or phrase:</label>
                <!-- Labels the text box. -->

                <br>
                <!-- Moves the text box to the next line. -->

                <input type="text" id="userString">
                <!-- Lets the user type a word or phrase. -->
            </div>
            <!-- Ends the input group. -->

            <button type="submit" onclick="checkPalindrome()">Check</button>
            <!-- Calls the JavaScript function when clicked. -->
        </form>
        <!-- Ends the form. -->

        <div id="validationMessage"></div>
        <!-- Shows validation messages using innerHTML. -->

        <div id="palindromeResult">
            <!-- Shows palindrome messages using innerHTML. -->

            <p>Result will show here.</p>
            <!-- Shows the starting message. -->
        </div>
        <!-- Ends the result box. -->
    </div>
    <!-- Ends the main content box. -->
